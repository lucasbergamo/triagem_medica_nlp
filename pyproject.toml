[tool.poetry]
name = "triagem-medica-nlp"
version = "0.1.0"
description = "Triagem automática de laudos médicos por urgência — Tech Challenge Fase 03 FIAP MLET"
authors = ["Lucas Bergamo <lucascbergamo@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
scikit-learn = ">=1.5"
pandas = ">=2.2"
pyarrow = ">=17.0"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.32" }
prometheus-client = ">=0.21"
pydantic-settings = ">=2.4"
structlog = ">=24.4"
skl2onnx = ">=1.17"
onnxruntime = ">=1.19"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.7"
httpx2 = ">=0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.report]
fail_under = 60
