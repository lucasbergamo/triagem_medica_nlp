# Airflow — LocalExecutor + Postgres.
# As tasks chamam módulos de src/ e leem/escrevem data/, models/ e metrics/ da raiz do projeto.

x-airflow-common:
  &airflow-common
  build:
    context: .
  env_file:
    - .env
  environment:
    &airflow-common-env
    PYTHONPATH: "/opt/airflow/dags:/opt/airflow/project"
    AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
    AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__FAB__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.session,airflow.providers.fab.auth_manager.api.auth.backend.basic_auth"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "300"
    AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: "20"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/project/src
    - ../data:/opt/airflow/project/data
    - ../models:/opt/airflow/project/models
    - ../metrics:/opt/airflow/project/metrics
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow-network

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-network

  init:
    <<: *airflow-common
    command: ["db", "migrate"]
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }

  webserver:
    <<: *airflow-common
    hostname: airflow-webserver
    command: api-server
    ports: ["8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__DEFAULT_UI_LANGUAGE: "pt-BR"
      AIRFLOW__API__WORKERS: 1
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: '0'
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
      _AIRFLOW_WWW_USER_ROLE: "Admin"
    deploy:
      resources:
        limits: { cpus: '1.0', memory: '1g' }
        reservations: { cpus: '0.25', memory: '512m' }

  scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      webserver: { condition: service_healthy }
      init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '300'
    deploy:
      resources:
        # Com LocalExecutor as tasks (treino, exportação ONNX) rodam dentro do scheduler.
        limits: { cpus: '2.0', memory: '2g' }
        reservations: { cpus: '0.25', memory: '512m' }

  dag-processor:
    <<: *airflow-common
    hostname: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psutil, sys; sys.exit(0) if any('dag-processor' in ' '.join(p.cmdline()) for p in psutil.process_iter(['cmdline'])) else sys.exit(1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '300'
    deploy:
      resources:
        limits: { cpus: '0.5', memory: '1g' }
        reservations: { cpus: '0.1', memory: '512m' }

volumes:
  airflow_postgres_data:

networks:
  airflow-network:
    driver: bridge
