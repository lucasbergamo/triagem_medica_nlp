# Triagem Médica NLP — compose raiz.
# Perfil default: api-sklearn e api-onnx — mesma imagem (estágio `serve` do Dockerfile), só
# `MODEL_BACKEND` muda entre as duas. Existirem lado a lado é o que permite comparar os dois
# backends ao vivo (latência, painel do Grafana) sem rebuild. Prometheus e grafana entram no
# bloco de observabilidade, ao lado destes dois serviços.
# Perfil airflow: pendente, integra airflow/docker-compose.yaml quando a orquestração entrar.
# Perfil ci: os dois serviços abaixo, para lint/test em container (paridade com o CI do GitHub).
name: triagem

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  api-sklearn:
    container_name: triagem-api-sklearn
    build:
      context: .
      target: serve
    environment:
      - MODEL_BACKEND=sklearn
    ports:
      - "8000:8000"
    healthcheck: *api-healthcheck

  api-onnx:
    container_name: triagem-api-onnx
    build:
      context: .
      target: serve
    environment:
      - MODEL_BACKEND=onnx
    ports:
      - "8001:8000"
    healthcheck: *api-healthcheck

  lint:
    container_name: triagem-lint
    build:
      context: .
      target: lint
    command: ["sh", "-c", "ruff check src/ tests/ scripts/ && ruff format --check src/ tests/ scripts/"]
    profiles:
      - ci

  ci:
    container_name: triagem-ci
    build:
      context: .
      target: ci
    command: ["pytest", "tests/", "-v", "--tb=short", "--cov=src", "--cov-report=term-missing"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    profiles:
      - ci
