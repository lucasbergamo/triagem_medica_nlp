# Triagem Médica NLP — compose raiz.
# Perfil default (api-sklearn, api-onnx, prometheus, grafana) entra no B3/B5.
# Perfil airflow entra no B6, integrando airflow/docker-compose.yaml.
# Perfil ci: os dois serviços abaixo, para lint/test em container (paridade com o CI do GitHub).
name: triagem

services:
  lint:
    container_name: triagem-lint
    build:
      context: .
      target: lint
    command: ["sh", "-c", "ruff check src/ tests/ scripts/ && ruff format --check src/ tests/ scripts/"]
    profiles:
      - ci

  ci:
    container_name: triagem-ci
    build:
      context: .
      target: ci
    command: ["pytest", "tests/", "-v", "--tb=short", "--cov=src", "--cov-report=term-missing"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    profiles:
      - ci
