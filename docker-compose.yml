# Triagem Médica NLP — compose raiz.
# Perfil default: api-sklearn, api-onnx, prometheus e grafana. As duas APIs são a mesma imagem
# (estágio `serve` do Dockerfile), só `MODEL_BACKEND` muda entre as duas — existirem lado a
# lado é o que permite comparar os dois backends ao vivo (latência, painel do Grafana) sem
# rebuild. Prometheus faz scrape de `/metrics` nas duas a cada 5s; Grafana sobe com datasource
# e dashboard já provisionados — nada de importar JSON pela UI.
# Perfil airflow: LocalExecutor + Postgres (postgres, init, webserver, scheduler,
# dag-processor). Isolado do perfil default por desenho — não sobem juntos (RAM limitada no
# ambiente local de desenvolvimento). Cada task da DAG chama um módulo de src/ ou scripts/
# diretamente, por isso a imagem monta esses diretórios também, além de data/models/metrics.
# Perfil ci: os dois serviços abaixo, para lint/test em container (paridade com o CI do GitHub).
name: triagem

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-airflow-common:
  &airflow-common
  build:
    context: ./airflow
  env_file:
    - ./airflow/.env
  environment:
    &airflow-common-env
    PYTHONPATH: "/opt/airflow/dags:/opt/airflow/project"
    AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
    AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_local}@airflow-postgres:5432/${POSTGRES_DB:-airflow}"
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__FAB__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.session,airflow.providers.fab.auth_manager.api.auth.backend.basic_auth"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "300"
    AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: "20"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/project/src
    - ./scripts:/opt/airflow/project/scripts
    - ./tests:/opt/airflow/project/tests
    - ./data:/opt/airflow/project/data
    - ./models:/opt/airflow/project/models
    - ./metrics:/opt/airflow/project/metrics
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow-network

services:
  api-sklearn:
    container_name: triagem-api-sklearn
    build:
      context: .
      target: serve
    environment:
      - MODEL_BACKEND=sklearn
    ports:
      - "8000:8000"
    healthcheck: *api-healthcheck

  api-onnx:
    container_name: triagem-api-onnx
    build:
      context: .
      target: serve
    environment:
      - MODEL_BACKEND=onnx
    ports:
      - "8001:8000"
    healthcheck: *api-healthcheck

  prometheus:
    container_name: triagem-prometheus
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - api-sklearn
      - api-onnx

  grafana:
    container_name: triagem-grafana
    image: grafana/grafana:10.4.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  lint:
    container_name: triagem-lint
    build:
      context: .
      target: lint
    # Não mapeia volume nenhum, então não tem o problema de arquivo-de-root do `ci` abaixo —
    # roda com o uid/gid do host por consistência (nenhum serviço deste compose roda como
    # root por padrão).
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    # RUFF_NO_CACHE: sem isso, o ruff tenta gravar /app/.ruff_cache dentro da própria imagem
    # (não é um volume montado), e essa árvore pertence a root (construída no build, antes do
    # `user:` acima existir) — o uid do host não tem permissão de escrita nela. O cache não
    # sobreviveria de qualquer forma: o container é `--rm`, descartado a cada `docker compose
    # run`.
    environment:
      - RUFF_NO_CACHE=true
    command: ["sh", "-c", "ruff check src/ tests/ scripts/ && ruff format --check src/ tests/ scripts/"]
    profiles:
      - ci

  ci:
    container_name: triagem-ci
    build:
      context: .
      target: ci
    # Sem isso, o container roda como root (a imagem não declara USER) e os arquivos que ele
    # escreve em data/silver, data/gold, models/ e metrics/ saem donos de root — o Airflow,
    # rodando com o uid do host, não consegue sobrescrevê-los depois (ex.: a task `preparacao`
    # falhando com PermissionError ao regravar data/silver/laudos.parquet). O default cobre
    # quem chama `docker compose` direto, sem passar pelo Makefile.
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    # COVERAGE_FILE: mesmo motivo do RUFF_NO_CACHE do serviço `lint` acima — o pytest-cov por
    # padrão grava `.coverage` em /app (a raiz da imagem, root-owned, não um volume montado),
    # e o uid do host não tem permissão de escrita ali. /tmp é world-writable em qualquer
    # imagem Debian/Python; o arquivo não precisa sobreviver ao container (`--rm`).
    environment:
      - COVERAGE_FILE=/tmp/.coverage
    command: ["pytest", "tests/", "-v", "--tb=short", "--cov=src", "--cov-report=term-missing"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    profiles:
      - ci

  airflow-postgres:
    container_name: triagem-airflow-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-airflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-airflow_local}"
      POSTGRES_DB: "${POSTGRES_DB:-airflow}"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-network
    profiles:
      - airflow

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    user: "0:0"
    depends_on:
      airflow-postgres: { condition: service_healthy }
    profiles:
      - airflow

  airflow-webserver:
    <<: *airflow-common
    hostname: airflow-webserver
    command: api-server
    ports: ["8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fS http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__DEFAULT_UI_LANGUAGE: "pt-BR"
      AIRFLOW__API__WORKERS: 1
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: '0'
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
      _AIRFLOW_WWW_USER_ROLE: "Admin"
    deploy:
      resources:
        limits: { cpus: '1.0', memory: '1g' }
        reservations: { cpus: '0.25', memory: '512m' }
    profiles:
      - airflow

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-webserver: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '300'
    deploy:
      resources:
        # Com LocalExecutor as tasks (treino, exportação ONNX) rodam dentro do scheduler.
        limits: { cpus: '2.0', memory: '2g' }
        reservations: { cpus: '0.25', memory: '512m' }
    profiles:
      - airflow

  airflow-dag-processor:
    <<: *airflow-common
    hostname: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import psutil, sys; sys.exit(0) if any('dag-processor' in ' '.join(p.cmdline()) for p in psutil.process_iter(['cmdline'])) else sys.exit(1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-common-env
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '300'
    deploy:
      resources:
        limits: { cpus: '0.5', memory: '1g' }
        reservations: { cpus: '0.1', memory: '512m' }
    profiles:
      - airflow

volumes:
  prometheus_data:
  grafana_data:
  airflow_postgres_data:

networks:
  airflow-network:
    driver: bridge
