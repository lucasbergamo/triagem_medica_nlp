name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint e Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry==2.4.1

      - name: Instalar dependências
        run: poetry install --no-interaction --no-ansi

      - name: ruff check
        run: poetry run ruff check src/ tests/ scripts/

      - name: ruff format --check
        run: poetry run ruff format --check src/ tests/ scripts/

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry==2.4.1

      - name: Instalar dependências
        run: poetry install --no-interaction --no-ansi

      - name: Rodar testes com cobertura
        run: poetry run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  # dag-validate e build entram no B7.
